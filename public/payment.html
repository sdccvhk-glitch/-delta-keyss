<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Checkout — DELTA.KEYS</title><link rel="stylesheet" href="/styles.css"></head>
<body class="store-page payment-page">
<header class="topbar"><a class="wordmark" href="/">MULTI SERVER PANEL</a><button class="hamburger" id="menuToggle">☰</button></header>
<div class="side-menu" id="sideMenu" hidden><a href="/">⌂ <span>Home</span></a><a href="/products">▣ <span>Products</span></a><a href="/status">⌕ <span>Check Order</span></a><a href="/admin">↪ <span>Login</span></a></div>
<main class="payment-wrap"><section class="payment-card">
<div class="payment-kicker">SECURE CHECKOUT</div><h1 id="payProduct">Loading…</h1><div id="payDuration" class="muted"></div>
<div class="amount-pill"><span>₹</span><b id="payAmount">0.00</b></div>
<div id="gatewayArea" class="qr-panel"><div class="gateway-logo">RAZORPAY</div><p class="scan-note">Pay securely using UPI, cards or other available checkout methods.</p><button id="payButton" class="open-upi" type="button">Pay securely ↗</button><p id="gatewayNote" class="muted"></p></div>
<div class="payment-check"><div class="check-line"></div><div class="check-row"><span>✓ Payment is verified automatically</span><b id="timer">READY</b></div></div>
<div id="result" class="result-box" hidden></div><p id="error" class="form-error"></p>
<p class="payment-safe">◈ Secure checkout • key appears automatically after verified payment</p>
</section></main>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="/payment.js"></script>
<script>const m=document.getElementById('sideMenu');document.getElementById('menuToggle').onclick=()=>m.hidden=!m.hidden;</script></body></html>
