<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Checkout — DELTA.KEYS</title><link rel="stylesheet" href="/styles.css"></head>
<body class="store-page payment-page">
<header class="topbar"><a class="wordmark" href="/">MULTI SERVER PANEL</a><button class="hamburger" id="menuToggle">☰</button></header>
<div class="side-menu" id="sideMenu" hidden><a href="/">⌂ <span>Home</span></a><a href="/products">▣ <span>Products</span></a><a href="/status">⌕ <span>Check Order</span></a><a href="/payment">▤ <span>Payment</span></a><a href="/admin">↪ <span>Login</span></a></div>
<main class="payment-wrap">
<section class="payment-card">
  <div class="payment-kicker">PAYING FOR</div>
  <h1 id="payProduct">Loading…</h1>
  <div class="amount-pill"><span>₹</span><b id="payAmount">0.00</b></div>

  <div class="qr-panel">
    <img class="upi-qr" src="/upi-qr.jpg" alt="UPI payment QR">
    <p class="scan-note">Scan QR or <span>Open UPI</span> below</p>
    <div class="upi-apps"><span>PhonePe</span><span>Paytm</span><span>G Pay</span></div>
    <a id="upiOpen" class="open-upi" href="#">Open UPI Payment App ↗</a>
  </div>

  <div class="payment-check">
    <div class="check-line"></div>
    <div class="check-row"><span>↻ &nbsp;After payment, enter your UTR below</span><b id="timer">04:00</b></div>
  </div>

  <form id="paymentForm">
    <label>UTR / UPI TRANSACTION ID <i>*</i></label>
    <input id="reference" required minlength="6" maxlength="100" autocomplete="off" placeholder="Enter your UTR number">
    <button class="purchase-btn submit-payment" type="submit">Submit Payment <span>→</span></button>
    <p id="error" class="form-error"></p>
  </form>
  <div id="result" class="result-box" hidden></div>
  <p class="payment-safe">◈ Secure payment • Key released after payment verification</p>
</section>
</main>
<script src="/payment.js"></script>
<script>
const m=document.getElementById('sideMenu');document.getElementById('menuToggle').onclick=()=>m.hidden=!m.hidden;
let left=240;const t=document.getElementById('timer');setInterval(()=>{if(left>0){left--;t.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}},1000);
</script></body></html>
