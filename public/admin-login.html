<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin Login — DELTA.KEYS</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-page">
  <div class="admin-bg"></div>
  <main class="admin-login-wrap">
    <form id="loginForm" class="admin-login-card">
      <a class="admin-back-link" href="/">← Back to store</a>
      <div class="admin-logo-mark">△</div>
      <div class="admin-eyebrow">PRIVATE AREA</div>
      <h1>Admin login</h1>
      <p>Manage products, keys, stock and customer orders from the private admin page.</p>
      <label>Username<input id="user" required autocomplete="username" value="admin"></label>
      <label>Password<input id="pass" required type="password" autocomplete="current-password"></label>
      <button class="admin-btn admin-btn-primary full" type="submit">Login to Admin</button>
      <p id="loginError" class="admin-error" role="alert"></p>
    </form>
  </main>
<script>
const SESSION_MS=2*24*60*60*1000;
const form=document.getElementById('loginForm');
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const user=document.getElementById('user').value.trim();
  const pass=document.getElementById('pass').value;
  const error=document.getElementById('loginError');
  if(!user||!pass){error.textContent='Enter both username and password.';return;}
  const auth='Basic '+btoa(unescape(encodeURIComponent(user+':'+pass)));
  try{
    const r=await fetch('/api/admin/data',{headers:{Authorization:auth}});
    let out={}; try{out=await r.json()}catch{}
    if(!r.ok) throw Error(out.error||'Invalid admin username or password.');
    sessionStorage.setItem('delta:adminAuth',auth);
    sessionStorage.setItem('delta:adminLoginAt',String(Date.now()));
    location.href='/admin/dashboard';
  }catch(err){error.textContent=err.message;}
});
</script>
</body>
</html>
