<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | DELTA.KEYS</title><link rel="stylesheet" href="/styles.css"></head><body class="admin-page"><header class="topbar"><a class="wordmark" href="/">MULTI SERVER <span>PANEL</span></a><a class="admin-home" href="/">⌂</a></header><main class="admin-login-wrap"><form id="loginForm" class="admin-login-card"><div class="admin-mark">◆</div><div class="kicker">DELTA.KEYS ADMIN</div><h1>Admin Login</h1><p>Secure access to your dashboard</p><label>EMAIL ADDRESS<input id="user" type="email" autocomplete="username" placeholder="Enter your admin email" required></label><label>PASSWORD<input id="pass" type="password" autocomplete="current-password" placeholder="Enter your password" required></label><label>SECRET CODE<input id="secret" type="password" autocomplete="one-time-code" placeholder="Enter secret code" required></label><label class="remember"><input id="remember" type="checkbox"> <span>Remember me for 24 hours</span></label><button class="login-btn" type="submit">↪ &nbsp; Login to Dashboard</button><p id="loginError" class="form-error"></p></form></main><script>
const f=document.getElementById('loginForm');
const remember=document.getElementById('remember');
const er=document.getElementById('loginError');
const SESSION_MS=24*60*60*1000;
function readAuth(){
  const store=localStorage.getItem('delta:adminAuth')?localStorage:sessionStorage;
  const auth=store.getItem('delta:adminAuth')||'';
  const secret=store.getItem('delta:adminSecret')||'';
  const at=Number(store.getItem('delta:adminLoginAt')||0);
  if(auth&&secret&&at&&Date.now()-at<SESSION_MS)return {auth,secret,at};
  localStorage.removeItem('delta:adminAuth');localStorage.removeItem('delta:adminSecret');localStorage.removeItem('delta:adminLoginAt');
  sessionStorage.removeItem('delta:adminAuth');sessionStorage.removeItem('delta:adminSecret');sessionStorage.removeItem('delta:adminLoginAt');
  return null;
}
const existing=readAuth();
if(existing) location.replace('/admin/dashboard');
remember.checked=true;
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value,s=document.getElementById('secret').value;
  er.textContent='';
  if(!s){er.textContent='Secret code is required.';return}
  try{
    const auth='Basic '+btoa(unescape(encodeURIComponent(u+':'+p)));
    const r=await fetch('/api/admin/data',{headers:{Authorization:auth,'X-Admin-Secret':s}});
    const out=await r.json();
    if(!r.ok)throw Error(out.error||'Invalid login');
    const store=remember.checked?localStorage:sessionStorage;
    const other=remember.checked?sessionStorage:localStorage;
    other.removeItem('delta:adminAuth');other.removeItem('delta:adminSecret');other.removeItem('delta:adminLoginAt');
    store.setItem('delta:adminAuth',auth);
    store.setItem('delta:adminSecret',s);
    store.setItem('delta:adminLoginAt',String(Date.now()));
    location.replace('/admin/dashboard');
  }catch(x){er.textContent=x.message}
});
</script></body></html>
