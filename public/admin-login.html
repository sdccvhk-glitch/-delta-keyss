<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — DELTA.KEYS</title><link rel="stylesheet" href="/styles.css"></head><body class="admin-page"><main class="admin-login-wrap"><form id="loginForm" class="admin-login-card"><a class="admin-back-link" href="/">← Back to store</a><div class="admin-logo-mark">△</div><div class="eyebrow">DELTA.KEYS ADMIN</div><h1>Sign in</h1><p>Manage products, key inventory and customer orders.</p><label>Username<input id="user" autocomplete="username" value="admin" required></label><label>Password<input id="pass" type="password" autocomplete="current-password" required></label><button class="btn primary full" type="submit">Login to Admin</button><p id="loginError" class="admin-error"></p></form></main><script>const f=document.getElementById('loginForm');f.addEventListener('submit',async e=>{e.preventDefault();const u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value,er=document.getElementById('loginError');er.textContent='';try{const auth='Basic '+btoa(unescape(encodeURIComponent(u+':'+p)));const r=await fetch('/api/admin/data',{headers:{Authorization:auth}});const out=await r.json();if(!r.ok)throw Error(out.error||'Invalid login');sessionStorage.setItem('delta:adminAuth',auth);sessionStorage.setItem('delta:adminLoginAt',String(Date.now()));location.href='/admin/dashboard'}catch(x){er.textContent=x.message}});</script></body></html>
