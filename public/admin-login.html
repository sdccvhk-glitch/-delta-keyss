<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071225">
  <title>Admin Login — DELTA.KEYS</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-page admin-login-modern">
  <main class="admin-login-wrap">
    <form id="loginForm" class="admin-login-card">
      <div class="admin-shield" aria-hidden="true">🔒</div>
      <div class="admin-login-badge">ADMIN PANEL</div>
      <div class="admin-brand">DELTA<span>.KEYS</span></div>
      <h1>Admin Login</h1>
      <div class="admin-accent-line"></div>

      <label>
        <span class="sr-only">Username</span>
        <div class="admin-input-wrap">
          <span class="admin-input-icon">♙</span>
          <input id="user" type="text" autocomplete="username" placeholder="Username" required>
        </div>
      </label>

      <label>
        <span class="sr-only">Password</span>
        <div class="admin-input-wrap">
          <span class="admin-input-icon">♙</span>
          <input id="pass" type="password" autocomplete="current-password" placeholder="Password" required>
          <button class="password-toggle" id="togglePassword" type="button" aria-label="Show password">◉</button>
        </div>
      </label>

      <label class="remember">
        <input id="remember" type="checkbox" checked>
        <span>Remember me for 24 hours</span>
      </label>

      <button class="login-btn" type="submit">Login</button>
      <p id="loginError" class="form-error"></p>
      <p class="admin-login-note">Only authorized admins can access this panel.</p>
    </form>
  </main>

<script>
const f=document.getElementById('loginForm');
const remember=document.getElementById('remember');
const er=document.getElementById('loginError');
const pass=document.getElementById('pass');
const toggle=document.getElementById('togglePassword');
const SESSION_MS=24*60*60*1000;

function readAuth(){
  const store=localStorage.getItem('delta:adminAuth')?localStorage:sessionStorage;
  const auth=store.getItem('delta:adminAuth')||'';
  const at=Number(store.getItem('delta:adminLoginAt')||0);
  if(auth&&at&&Date.now()-at<SESSION_MS)return {auth,at};
  localStorage.removeItem('delta:adminAuth');localStorage.removeItem('delta:adminLoginAt');
  sessionStorage.removeItem('delta:adminAuth');sessionStorage.removeItem('delta:adminLoginAt');
  return null;
}

const existing=readAuth();
if(existing) location.replace('/admin/dashboard');

toggle.addEventListener('click',()=>{
  const show=pass.type==='password';
  pass.type=show?'text':'password';
  toggle.textContent=show?'◉':'○';
  toggle.setAttribute('aria-label',show?'Hide password':'Show password');
});

f.addEventListener('submit',async e=>{
  e.preventDefault();
  er.textContent='';
  const u=document.getElementById('user').value.trim();
  const p=pass.value;
  if(!u||!p){er.textContent='Username and password are required.';return}
  try{
    const auth='Basic '+btoa(unescape(encodeURIComponent(u+':'+p)));
    const r=await fetch('/api/admin/data',{headers:{Authorization:auth}});
    const out=await r.json();
    if(!r.ok)throw Error(out.error||'Invalid username or password');
    const store=remember.checked?localStorage:sessionStorage;
    const other=remember.checked?sessionStorage:localStorage;
    other.removeItem('delta:adminAuth');other.removeItem('delta:adminLoginAt');
    store.setItem('delta:adminAuth',auth);
    store.setItem('delta:adminLoginAt',String(Date.now()));
    location.replace('/admin/dashboard');
  }catch(x){er.textContent=x.message}
});
</script>
</body>
</html>
