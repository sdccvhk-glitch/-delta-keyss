<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10172a"><title>DELTA.KEYS — Multi Server Panel</title><link rel="stylesheet" href="/styles.css"></head>
<body class="store-page customer-home">
<header class="topbar"><a class="wordmark" href="/">MULTI SERVER PANEL</a><button class="hamburger" id="menuToggle">☰</button></header>
<div class="side-menu" id="sideMenu" hidden><a href="/">⌂ <span>Home</span></a><a href="/products">▣ <span>Products</span></a><a href="/status">⌕ <span>Check Order</span></a><a href="/admin">↪ <span>Login</span></a></div>
<main class="access-wrap"><section class="access-card customer-card">
<div class="access-head"><div class="kicker">DELTA.KEYS</div><h1>Select Access</h1><p>Verified payment with automatic key delivery</p></div>
<form id="accessForm">
<label for="productSelect">PRODUCT</label><select id="productSelect" required><option value="">Choose your product</option></select>
<label for="durationSelect">DURATION</label><select id="durationSelect" required disabled><option value="">Choose product first</option></select>
<div id="pricePreview" class="price-preview" hidden>₹<b id="selectedPrice">0</b></div>
<button class="promo-row" type="button" id="promoToggle">🏷 <span>HAVE A PROMO CODE?</span><b>⌄</b></button>
<div id="promoBox" class="promo-box" hidden><input id="promoCode" placeholder="Enter promo code"><button type="button" id="applyPromo">Apply</button><small id="promoMsg"></small></div>
<button class="purchase-btn" type="submit">Purchase Access <span>→</span></button><p id="accessError" class="form-error"></p>
</form></section><div class="trust-line"><span class="shield-dot">◈</span><span>Secure payment • automatic key delivery after verification</span></div></main>
<script>
const menu=document.getElementById('sideMenu');document.getElementById('menuToggle').onclick=()=>menu.hidden=!menu.hidden;
const ps=document.getElementById('productSelect'),ds=document.getElementById('durationSelect'),price=document.getElementById('pricePreview'),priceText=document.getElementById('selectedPrice');
let products=[];
(async()=>{try{const r=await fetch('/api/products');products=await r.json();products.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;ps.appendChild(o)});}catch(e){document.getElementById('accessError').textContent='Unable to load products. Please refresh.'}})();
ps.onchange=()=>{ds.innerHTML='<option value="">Choose duration</option>';const p=products.find(x=>x.id===ps.value);(p?.plans||[]).forEach(pl=>{const o=document.createElement('option');o.value=pl.id;o.textContent=pl.name+' — ₹'+Number(pl.price).toFixed(0);o.dataset.price=pl.price;ds.appendChild(o)});ds.disabled=!p;price.hidden=true};
ds.onchange=()=>{const o=ds.selectedOptions[0];if(o&&o.value){price.hidden=false;priceText.textContent=Number(o.dataset.price).toFixed(0)}else price.hidden=true};
document.getElementById('promoToggle').onclick=()=>document.getElementById('promoBox').hidden=!document.getElementById('promoBox').hidden;
document.getElementById('applyPromo').onclick=()=>{document.getElementById('promoMsg').textContent=document.getElementById('promoCode').value.trim()?'Promo support can be enabled by the admin.':'Enter a promo code.'};
document.getElementById('accessForm').onsubmit=e=>{e.preventDefault();if(!ps.value||!ds.value)return;location.href='/payment?product='+encodeURIComponent(ps.value)+'&plan='+encodeURIComponent(ds.value)};
</script></body></html>
