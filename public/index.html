<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>DELTA.KEYS</title><style>body{font:15px system-ui;background:#0d0b14;color:#eee;max-width:1000px;margin:auto;padding:20px}section{background:#171323;padding:18px;border-radius:14px;margin:14px 0}input,button{padding:10px;margin:4px;background:#0d0b14;color:#fff;border:1px solid #40355a;border-radius:8px}table{width:100%}td,th{padding:8px;border-bottom:1px solid #302746;text-align:left}.key{font-family:monospace}</style><h1>DELTA.KEYS</h1><section><h2>Admin Login</h2><input id=u placeholder=username><input id=p type=password placeholder=password><button onclick=login()>Login</button><span id=m></span></section><main hidden><section><h2>Generate Key</h2><input id=g value=Belive placeholder="Game profile"><input id=d type=number value=1 placeholder="Device limit"><input id=l type=number value=30 placeholder="License days"><input id=q type=number value=1 placeholder="Batch quantity"><button onclick=gen()>Generate</button><pre id=o></pre></section><section><h2>Manage Keys</h2><button onclick=load()>Refresh</button><table><thead><tr><th>Key</th><th>Status</th><th>Expiry</th><th>Devices</th><th>Action</th></tr></thead><tbody id=t></tbody></table></section></main><script>let U,P;const H=()=>({'content-type':'application/json','x-admin-user':U,'x-admin-password':P});async function login(){U=u.value;P=p.value;let r=await fetch('/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:U,password:P})}),j=await r.json();if(j.ok){document.querySelector('main').hidden=false;m.textContent=' Logged in';load()}else m.textContent=' '+j.error}async function gen(){let r=await fetch('/admin/keys',{method:'POST',headers:H(),body:JSON.stringify({gameProfile:g.value,deviceLimit:+d.value,licenseDays:+l.value,batchQuantity:+q.value})}),j=await r.json();o.textContent=j.ok?j.keys.map(x=>x.key).join('\n'):j.error;load()}async function load(){let j=await (await fetch('/admin/keys',{headers:H()})).json();t.innerHTML=(j.keys||[]).map(k=>`<tr><td class=key>${k.key}</td><td>${k.blocked?'BLOCKED':k.used?'USED':'NOT USED'}</td><td>${k.expiresAt||'—'}</td><td>${k.devices.length}/${k.deviceLimit}</td><td><button onclick="act('${k.key}','${k.blocked?'unblock':'block'}')">${k.blocked?'Unblock':'Block'}</button><button onclick="reset('${k.key}')">Reset</button></td></tr>`).join('')}async function act(k,a){await fetch('/admin/keys/'+encodeURIComponent(k)+'/'+a,{method:'POST',headers:H()});load()}async function reset(k){await fetch('/admin/keys/'+encodeURIComponent(k)+'/reset-devices',{method:'POST',headers:H()});load()}</script>
