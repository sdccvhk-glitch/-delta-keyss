<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Admin Dashboard — DELTA.KEYS</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-page">
  <div class="admin-bg"></div>

  <div id="dashboard">
    <header class="admin-mobile-header">
      <button id="menuToggle" class="menu-button" aria-label="Open menu">☰</button>
      <h1>Product Keys</h1>
      <button id="adminBadge" class="admin-badge" type="button">♙ ADMIN</button>
    </header>

    <div id="adminMenu" class="admin-menu" hidden>
      <a href="/">Store</a>
      <a href="/products">Products</a>
      <button id="menuLogout" type="button">Log out</button>
    </div>

    <main class="admin-mobile-content">
      <section class="admin-panel product-selector-panel">
        <label for="keyProduct">SELECT PRODUCT</label>
        <select id="keyProduct"></select>
      </section>

      <section class="admin-panel upload-panel">
        <div class="upload-title">⇧ <span>Upload Keys</span></div>
        <form id="keysForm" class="key-upload-form">
          <label for="uploadProduct">PRODUCT</label>
          <select id="uploadProduct"></select>

          <label for="uploadPlan">PLAN</label>
          <select id="uploadPlan">
            <option>7 DAYS</option>
            <option>30 DAYS</option>
            <option>90 DAYS</option>
            <option>LIFETIME</option>
          </select>

          <label for="keysInput">PASTE KEYS <span>(one per line)</span></label>
          <textarea id="keysInput" rows="6" placeholder="XXXX-YYYY-ZZZZ
AAAA-BBBB-CCCC
•••"></textarea>
          <button class="admin-btn admin-btn-primary upload-button" type="submit">Upload Keys</button>
          <p id="keyUploadMsg" class="admin-message"></p>
        </form>
      </section>

      <section class="admin-panel stock-panel">
        <div class="admin-section-title"><span>KEY STOCK</span><strong id="vaultCount">0</strong></div>
        <div id="stats" class="admin-stats"></div>
      </section>

      <section class="admin-panel">
        <div class="admin-section-head">
          <div><span class="admin-kicker">INVENTORY</span><h2>Add / edit products</h2></div>
          <button id="refresh" class="admin-btn admin-btn-secondary" type="button">Refresh</button>
        </div>
        <form id="productForm" class="admin-product-form">
          <input id="pName" required placeholder="Product name">
          <input id="pPrice" required type="number" min="0" placeholder="Price ₹">
          <input id="pStock" required type="number" min="0" placeholder="Stock quantity">
          <input id="pBadge" placeholder="Badge e.g. NEW">
          <input id="pDescription" placeholder="Description">
          <button class="admin-btn admin-btn-primary" type="submit">Add product</button>
        </form>
        <div id="productsAdmin" class="admin-list"></div>
      </section>

      <section class="admin-panel">
        <div class="admin-section-head">
          <div><span class="admin-kicker">CUSTOMERS & ORDERS</span><h2>Orders and customer keys</h2></div>
        </div>
        <div id="orders" class="admin-list"></div>
      </section>
    </main>
  </div>
  <script src="/admin-dashboard.js"></script>
</body>
</html>
